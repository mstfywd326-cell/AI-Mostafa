services:
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - server

  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://ai_mostafa:ai_mostafa_password@database:5432/ai_mostafa
      - REDIS_URL=redis://redis:6379
    depends_on:
      - database
      - redis

  agent:
    build: ./agent
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://ai_mostafa:ai_mostafa_password@database:5432/ai_mostafa
      - REDIS_URL=redis://redis:6379
    depends_on:
      - database
      - redis

  browser:
    build: ./browser
    restart: unless-stopped
    shm_size: "2gb"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_mostafa
      POSTGRES_PASSWORD: ai_mostafa_password
      POSTGRES_DB: ai_mostafa
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
